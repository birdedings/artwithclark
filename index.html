  }</style><script>document.addEventListener("DOMContentLoaded", function () {
    var galleries = document.querySelectorAll(".art-gallery");
    if (!galleries.length) return;

    var SETS = {

      ],
      photographs: [
      ]
    };
    // =================================================

    var lightbox = document.createElement("div");
    lightbox.id = "art-lightbox";
    lightbox.innerHTML = '<img alt="">';
    document.body.appendChild(lightbox);
    var lbImg = lightbox.querySelector("img");

    galleries.forEach(function (gallery) {
      var images = SETS[gallery.getAttribute("data-set")];
      if (!images) return;   // name not found, skip this gallery

      var row = document.createElement("div");
      var track = document.createElement("div");
      row.className = "row";
      track.className = "track";

      images.concat(images).forEach(function (src) {
        var img = document.createElement("img");
        img.src = src;
        img.alt = "Digital artwork by Clark";
        img.addEventListener("click", function () { lbImg.src = src; lightbox.classList.add("open"); });
        track.appendChild(img);
      });

      track.style.setProperty("--duration", (images.length * 6) + "s");
      row.appendChild(track);
      gallery.appendChild(row);
    });

    lightbox.addEventListener("click", function () { lightbox.classList.remove("open"); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") lightbox.classList.remove("open"); });
